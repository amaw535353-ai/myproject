name: ci

on:
  push:
    branches:
      - main
      - "phase1/**"
      - "phase2/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P2-A tenant-boundary evaluation
        run: python -m evals.p2a_tenant_boundary
      - name: P2-B indirect-prompt-injection evaluation
        run: python -m evals.p2b_indirect_prompt_injection
