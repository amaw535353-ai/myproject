name: ci

on:
  push:
    branches:
      - main
      - "phase1/**"
      - "phase2/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P2-A tenant-boundary evaluation
        run: python -m evals.p2a_tenant_boundary
      - name: P2-B indirect-prompt-injection evaluation
        run: python -m evals.p2b_indirect_prompt_injection
      - name: P2-C MCP tool-poisoning evaluation
        run: python -m evals.p2c_mcp_tool_poisoning
      - name: P2-D token-passthrough evaluation
        run: python -m evals.p2d_token_passthrough
      - name: P2-E SSRF and redirect evaluation
        run: python -m evals.p2e_ssrf_redirects
      - name: P2-F durable-memory evaluation
        run: python -m evals.p2f_durable_memory_poisoning
      - name: P2-G resource-exhaustion evaluation
        run: python -m evals.p2g_resource_exhaustion
      - name: P2-H telemetry-redaction evaluation
        run: python -m evals.p2h_telemetry_leakage
      - name: P2-I malicious-artifact evaluation
        run: python -m evals.p2i_artifact_handling
      - name: P2-J browser-prompt-injection evaluation
        run: python -m evals.p2j_browser_prompt_injection
      - name: P2-K durable-approval-workflow evaluation
        run: python -m evals.p2k_durable_approval_workflow
      - name: P2-L transactional-outbox evaluation
        run: python -m evals.p2l_transactional_outbox
      - name: P2-M execution-time-authorization evaluation
        run: python -m evals.p2m_execution_time_authorization
      - name: P2-N authorization-freshness evaluation
        run: python -m evals.p2n_authorization_freshness
      - name: P2-O authorization-provenance evaluation
        run: python -m evals.p2o_authorization_provenance
      - name: P2-P rollback-resistant trust-anchor evaluation
        run: python -m evals.p2p_rollback_resistant_anchor
      - name: P2-Q crash-safe control-plane recovery evaluation
        run: python -m evals.p2q_control_plane_recovery
