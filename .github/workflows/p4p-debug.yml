name: p4p-debug

on:
  push:
    branches:
      - "phase4/provider-crash-safe-state-machine"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: P4-P tests with diagnostic annotation
        shell: bash
        run: |
          set +e
          pytest tests/security/test_p4p_provider_crash_safe_state.py -vv 2>&1 | tee /tmp/p4p-test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/p4p-test-output.txt').read_text(errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=P4-P pytest diagnostic::{text}')
          PY
            exit "$status"
          fi
      - name: P4-P evaluation with diagnostic annotation
        shell: bash
        run: |
          set +e
          python -m evals.p4p_provider_crash_safe_state 2>&1 | tee /tmp/p4p-eval-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/p4p-eval-output.txt').read_text(errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=P4-P eval diagnostic::{text}')
          PY
            exit "$status"
          fi
