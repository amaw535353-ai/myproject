name: phase10

on:
  push:
    branches:
      - main
      - "phase10/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P10-A inference tenant, request, and runtime-state isolation evaluation
        run: python -m evals.p10a_inference_tenant_isolation
