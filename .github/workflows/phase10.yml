name: phase10

on:
  push:
    branches:
      - main
      - "phase10/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P10-A inference tenant, request, and runtime-state isolation evaluation
        run: python -m evals.p10a_inference_tenant_isolation
      - name: P10-B dynamic batching, scheduler fairness, admission, and resource isolation evaluation
        run: python -m evals.p10b_scheduler_security
      - name: P10-C KV and prefix-cache lifecycle, reuse, zeroization, and rollback safety evaluation
        run: python -m evals.p10c_cache_lifecycle
      - name: P10-D speculative decoding, draft trust, and disaggregated serving evaluation
        run: python -m evals.p10d_speculative_serving
      - name: P10-E adapter/LoRA hot-swap, tenant composition, and route integrity evaluation
        run: python -m evals.p10e_adapter_routing
      - name: P10-F non-destructive accelerator host collector smoke test
        run: python scripts/collect_p10f_gpu_evidence.py --probe-id phase10-ci-cpu-smoke > /tmp/p10f-gpu-probe.json
      - name: P10-F accelerator, GPU memory, DMA, and side-channel-profile evaluation
        run: python -m evals.p10f_accelerator_isolation
      - name: P10-G streaming cancellation, backpressure, output-channel, and tool framing evaluation
        run: python -m evals.p10g_streaming_security
      - name: P10-G real loopback streaming runtime lab
        run: python scripts/run_p10g_streaming_lab.py --output /tmp/p10g-loopback-report.json
