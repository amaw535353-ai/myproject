name: phase11

on:
  push:
    branches:
      - main
      - "phase11/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test repository
        run: pytest
      - name: P11-A workload identity, privilege, secret, network, RBAC, and image evaluation
        run: python -m evals.p11a_workload_security
      - name: P11-A hardened Kubernetes manifest static verification
        run: python scripts/check_p11a_k8s_manifests.py
      - name: P11-A real Linux least-privilege workload isolation lab
        run: python scripts/run_p11a_linux_sandbox_lab.py
      - name: P11-B Kubernetes security deterministic evaluation
        run: python -m evals.p11b_kubernetes_security
      - name: P11-B focused security tests
        run: python -m pytest -q tests/security/test_p11b_kubernetes_security.py
      - name: P11-C provider-neutral cloud security contract
        run: python -m pytest -q tests/security/test_p11c_cloud_security.py && python -m evals.p11c_cloud_security
      - name: P11-D deployed serving security contract
        run: python -m pytest -q tests/security/test_p11d_serving_security.py && python -m evals.p11d_serving_security
