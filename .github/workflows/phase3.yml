name: phase3

on:
  push:
    branches:
      - main
      - "phase3/**"
      - "phase4/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P3-A consolidated runtime evaluation
        run: python -m evals.p3a_default_high_impact_chain
      - name: P3-C default surface posture evaluation
        run: python -c 'import json; from evals.phase2_exit_gate import build_p3c_surface_posture_report as build; report = build(); print(json.dumps(report, indent=2, sort_keys=True)); raise SystemExit(0 if report["passed"] else 1)'
      - name: P3-D default credential-broker evaluation
        run: python -m evals.p3d_default_credential_broker
      - name: P3-E default durable-memory boundary evaluation
        run: python -m evals.p3e_default_memory_boundary
      - name: P3-F production trust-provider posture evaluation
        run: python -m evals.p3f_trust_provider_posture
      - name: P4-A checkpoint type-policy evaluation
        run: python -m evals.p4a_strict_checkpoint_serialization
      - name: P4-B durable checkpoint integrity evaluation
        run: python -m evals.p4b_durable_checkpoint_integrity
      - name: P4-C checkpoint confidentiality evaluation
        run: python -m evals.p4c_checkpoint_confidentiality
      - name: P4-D checkpoint key lifecycle evaluation
        run: python -m evals.p4d_checkpoint_key_lifecycle
      - name: P4-E checkpoint backup restore evaluation
        run: python -m evals.p4e_checkpoint_backup_restore
      - name: P4-F checkpoint trust-provider posture evaluation
        run: python -m evals.p4f_checkpoint_trust_provider_posture
      - name: P4-G checkpoint external adapter contract evaluation
        run: python -m evals.p4g_checkpoint_external_contract_harness
      - name: P4-H checkpoint runtime provider seam evaluation
        run: python -m evals.p4h_checkpoint_runtime_provider_seam
      - name: P4-I checkpoint lifecycle capability evaluation
        run: python -m evals.p4i_checkpoint_lifecycle_capabilities
