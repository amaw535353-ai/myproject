name: phase5

on:
  push:
    branches:
      - main
      - "phase5/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P5-A model artifact provenance and safe loading evaluation
        run: python -m evals.p5a_model_artifact_provenance
      - name: P5-B transitive model-package and adapter provenance evaluation
        run: python -m evals.p5b_model_package_provenance
      - name: P5-C immutable model-registry acquisition and release-pinning evaluation
        run: python -m evals.p5c_registry_release_pinning
      - name: P5-D provenance signing-key lifecycle and revocation evaluation
        run: python -m evals.p5d_key_lifecycle_revocation
      - name: P5-E model parser/runtime isolation and remote-code denial evaluation
        run: python -m evals.p5e_runtime_isolation
      - name: P5-F model poisoning and backdoor indicator evaluation
        run: python -m evals.p5f_model_scanning
      - name: P5-G model privacy, extraction, and membership-inference control evaluation
        run: python -m evals.p5g_model_privacy
