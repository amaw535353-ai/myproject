name: phase6

on:
  push:
    branches:
      - main
      - "phase6/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P6-A continuous AI security assurance regression evaluation
        run: python -m evals.p6a_security_regression
      - name: P6-B security invariant drift and waiver governance evaluation
        run: python -m evals.p6b_waiver_governance
      - name: P6-C assurance corpus evolution and coverage drift evaluation
        run: python -m evals.p6c_corpus_evolution
      - name: P6-D AI security posture and control coverage evaluation
        run: python -m evals.p6d_posture_reporting
      - name: P6-E adversarial finding lifecycle and closure evaluation
        run: python -m evals.p6e_finding_lifecycle
