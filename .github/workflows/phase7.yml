name: phase7

on:
  push:
    branches:
      - main
      - "phase7/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P7-A trust-boundary attack-path evaluation
        run: python -m evals.p7a_attack_paths
      - name: P7-B identity privilege capability escalation evaluation
        run: python -m evals.p7b_privilege_paths
      - name: P7-C data-flow tenant-isolation exfiltration evaluation
        run: python -m evals.p7c_data_exfiltration
      - name: P7-D secrets credential trust-root exposure evaluation
        run: python -m evals.p7d_secret_exposure_run
      - name: P7-E external dependency service-egress trust-path evaluation
        run: python -m evals.p7e_dependency_trust
      - name: P7-F dependency failure graceful-degradation security evaluation
        run: python -m evals.p7f_resilience_security
      - name: P7-G telemetry integrity auditability blind-spot evaluation
        run: python -m evals.p7g_telemetry_security
      - name: P7-H control-plane administrative change-path evaluation
        run: python -m evals.p7h_control_plane
      - name: P7-I cross-layer security invariant blast-radius evaluation
        run: python -m evals.p7i_invariant_blast_radius
