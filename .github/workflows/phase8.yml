name: phase8

on:
  push:
    branches:
      - main
      - "phase8/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P8-A multi-agent delegation authority-propagation evaluation
        run: python -m evals.p8a_agent_delegation
      - name: P8-B agent memory context-boundary evaluation
        run: python -m evals.p8b_agent_memory
      - name: P8-C agent goal plan instruction-integrity evaluation
        run: python -m evals.p8c_goal_plan_integrity
      - name: P8-D agent tool observation environment-integrity evaluation
        run: python -m evals.p8d_tool_observation_integrity
      - name: P8-E agent execution budget runaway-resource evaluation
        run: python -m evals.p8e_execution_budget
      - name: P8-F human approval autonomy-boundary evaluation
        run: python -m evals.p8f_human_approval
