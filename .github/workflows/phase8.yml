name: phase8

on:
  push:
    branches:
      - main
      - "phase8/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P8-A multi-agent delegation authority-propagation evaluation
        run: python -m evals.p8a_agent_delegation
      - name: P8-B agent memory context-boundary evaluation
        run: python -m evals.p8b_agent_memory
      - name: P8-C agent goal plan instruction-integrity evaluation
        run: python -m evals.p8c_goal_plan_integrity
      - name: P8-D agent tool observation environment-integrity evaluation
        run: python -m evals.p8d_tool_observation_integrity
      - name: P8-E agent execution budget runaway-resource evaluation
        run: python -m evals.p8e_execution_budget
      - name: P8-F human approval autonomy-boundary evaluation
        run: python -m evals.p8f_human_approval
      - name: P8-G agent communications message-protocol evaluation
        run: python -m evals.p8g_agent_messages
      - name: P8-H agent state-machine concurrency race evaluation
        run: python -m evals.p8h_state_machine
      - name: P8-I agent artifact workspace generated-code integrity evaluation
        run: python -m evals.p8i_agent_artifacts
      - name: P8-J agent rollback recovery persistence-boundary evaluation
        run: python -m evals.p8j_agent_recovery
      - name: P8-K provenance-led incident containment forensic reconstruction evaluation
        run: python -m evals.p8k_incident_forensics
      - name: P8-L integrated multi-agent compromise Phase 8 exit-gate evaluation
        run: python -m evals.p8l_phase8_exit_gate
