name: phase9

on:
  push:
    branches:
      - main
      - "phase9/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: P9-A training dataset provenance and holdout-isolation evaluation
        run: python -m evals.p9a_training_data_provenance
      - name: P9-B training data poisoning label-integrity contributor-trust evaluation
        run: python -m evals.p9b_training_data_poisoning
      - name: P9-C fine-tuning authorization and base-model binding evaluation
        run: python -m evals.p9c_fine_tuning_admission
      - name: P9-D training execution provenance and least-privilege boundary evaluation
        run: python -m evals.p9d_training_execution_provenance
      - name: P9-E checkpoint/resume integrity and rollback-safe lineage evaluation
        run: python -m evals.p9e_checkpoint_integrity
      - name: P9-F evaluation leakage and benchmark-contamination governance evaluation
        run: python -m evals.p9f_evaluation_governance
      - name: P9-G sensitive-data, PII, secret, and canary governance evaluation
        run: python -m evals.p9g_sensitive_data_governance
      - name: P9-H training-to-model-registry promotion and Phase 5 provenance handoff evaluation
        run: python -m evals.p9h_model_promotion
      - name: P9-I integrated training compromise exercise and Phase 9 exit gate
        run: python -m evals.p9i_phase9_exit_gate
