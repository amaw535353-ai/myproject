name: focused-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development tools
        run: python -m pip install -e ".[dev]"
      - name: Install pinned Semgrep
        run: pipx install semgrep==1.172.0
      - name: Ruff formatting
        run: ruff format --check aegis/rag real_model_evals evals/portfolio_adaptive_security.py scripts/run_portfolio_demo.py scripts/prepare_release_candidate.py tests/security/test_portfolio_gap_controls.py tests/security/test_portfolio_demo_evidence.py tests/security/test_real_model_rag_mcp.py tests/security/test_release_candidate.py
      - name: Ruff lint
        run: ruff check aegis/rag real_model_evals evals/portfolio_adaptive_security.py scripts/run_portfolio_demo.py scripts/prepare_release_candidate.py tests/security/test_portfolio_gap_controls.py tests/security/test_portfolio_demo_evidence.py tests/security/test_real_model_rag_mcp.py tests/security/test_release_candidate.py
      - name: Strict focused type check
        run: mypy real_model_evals aegis/rag/evaluation.py
      - name: Security static analysis
        run: bandit -q -r aegis/rag real_model_evals
      - name: Semgrep security analysis
        run: semgrep scan --config p/python --error aegis/rag real_model_evals
      - name: Dependency vulnerability audit
        run: pip-audit .
      - name: Validate reviewed secret baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path(".secrets.baseline").read_text())
          findings = [finding for matches in baseline["results"].values() for finding in matches]
          if len(findings) != 13 or any(finding.get("is_secret") is not False for finding in findings):
              raise SystemExit("secret baseline must contain exactly thirteen reviewed findings")
          PY
      - name: Reviewed-baseline secret detection
        run: |
          if [ -n "${GITHUB_ACTIONS:-}" ]; then
            git diff --name-only --diff-filter=ACMR -z HEAD^ HEAD
          else
            { git diff --name-only --diff-filter=ACMR HEAD; git ls-files --others --exclude-standard; } | sort -u | tr '\n' '\0'
          fi | grep -zvxF '.secrets.baseline' | xargs -0 -r detect-secrets-hook --baseline .secrets.baseline
      - name: Focused tests and coverage
        run: python -m pytest tests/security/test_portfolio_gap_controls.py tests/security/test_portfolio_demo_evidence.py tests/security/test_real_model_rag_mcp.py tests/security/test_release_candidate.py --cov=aegis.rag --cov=real_model_evals --cov-report=term-missing --cov-fail-under=65
      - name: Portfolio demonstration
        run: python scripts/run_portfolio_demo.py --output-dir build/portfolio-demo
      - name: Preserve commit-bound portfolio evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-evidence-${{ github.sha }}
          path: |
            build/portfolio-demo/evidence.json
            build/portfolio-demo/report.md
          if-no-files-found: error
          retention-days: 30
      - name: Patch whitespace check
        run: git diff --check
