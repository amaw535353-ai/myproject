name: release-candidate

on:
  pull_request:
    paths:
      - ".github/workflows/release-candidate.yml"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "scripts/prepare_release_candidate.py"
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned build and audit dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build source and wheel artifacts
        run: python -m build --sdist --wheel
      - name: Generate CycloneDX dependency SBOM
        run: pip-audit --format cyclonedx-json --output dist/aegisdesk-dependencies.cdx.json .
      - name: Validate artifacts and generate checksums
        run: python scripts/prepare_release_candidate.py dist
      - name: Smoke-install the wheel and its pinned runtime dependencies
        run: |
          python -m venv /tmp/aegisdesk-release-smoke
          /tmp/aegisdesk-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/aegisdesk-release-smoke/bin/python -c "import importlib.metadata, real_model_evals.rag_mcp; assert importlib.metadata.version('aegisdesk') == '0.101.0'"
      - name: Preserve release-candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegisdesk-release-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Patch whitespace check
        run: git diff --check

  attest:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release-candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aegisdesk-release-candidate-${{ github.sha }}
          path: dist
      - name: Attest main-branch release-candidate subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/release-manifest.json
            dist/SHA256SUMS
