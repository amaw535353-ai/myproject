[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisdesk"
version = "0.101.0"
description = "Zero-trust agentic RAG security lab"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "langgraph==1.2.11",
  "mcp==2.0.0",
  "qdrant-client==1.19.0",
  "uvicorn==0.52.1",
]

[project.urls]
Repository = "https://github.com/lahcennh3-jpg/aegisdesk"
Issues = "https://github.com/lahcennh3-jpg/aegisdesk/issues"
Documentation = "https://github.com/lahcennh3-jpg/aegisdesk/tree/main/docs"
Security = "https://github.com/lahcennh3-jpg/aegisdesk/security/policy"

[project.optional-dependencies]
dev = [
  "bandit==1.8.6",
  "detect-secrets==1.5.0",
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[tool.setuptools.packages.find]
include = ["aegis*", "apps*", "evals*", "real_model_evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["aegis.rag", "real_model_evals"]

[tool.coverage.report]
show_missing = true
skip_covered = true
