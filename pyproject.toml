[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisdesk"
version = "0.43.0"
description = "Zero-Trust Agentic RAG Security Lab"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "langgraph==1.2.11",
  "mcp==2.0.0",
  "qdrant-client==1.19.0",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["aegis*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
