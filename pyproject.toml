[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisdesk"
version = "0.51.0"
description = "Zero-trust agentic RAG security lab"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "langgraph==1.2.11",
  "mcp==2.0.0",
  "qdrant-client==1.19.0",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["aegis*", "apps*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
